name: antigyc - Bug Report
description: File a bug report for the antigyc npm CLI
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Please search existing issues in Jervis-UMTC/antigravity-cli-npm before opening a duplicate.
  - type: input
    id: cli-version
    attributes:
      label: antigyc version
      description: Run `antigyc --version` and paste the output.
      placeholder: e.g., 0.1.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment context
      value: |
        - **OS:**
        - **Shell:**
        - **Terminal emulator:**
        - **Node.js version:**
        - **npm version:**
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Explain the steps required to reproduce the problem.
      value: |
        1. Go to '...'
        2. Run command '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error output
      description: What actually happened? Include the CLI exit code or relevant terminal output.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: antigyc doctor output
      description: Paste relevant diagnostics. Remove personal paths, email addresses, or other sensitive information first.
    validations:
      required: false
