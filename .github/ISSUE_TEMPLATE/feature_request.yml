name: antigyc - Feature Request
description: Propose a new feature or improvement for the antigyc npm CLI
title: "[Feature Request]: "
labels: ["type: feature request"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Please search existing issues in Jervis-UMTC/antigravity-cli-npm before opening a duplicate request.
  - type: textarea
    id: pitch
    attributes:
      label: Is your feature request related to a specific problem?
      description: Describe the problem or limitation.
      placeholder: Describe the problem or limitation...
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Describe what you want to happen.
      placeholder: Describe your proposed feature or improvement...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Describe other solutions or approaches you considered.
      placeholder: What other solutions did you consider?
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, CLI output examples, or screenshots that help explain the request.
